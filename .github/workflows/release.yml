name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          makefile_version="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1)"
          if [[ -z "$makefile_version" ]]; then
            echo "::error::Makefile does not define PKG_VERSION"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=v${makefile_version}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION#v}"
          makefile_version="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1)"
          if [[ -z "$makefile_version" ]]; then
            echo "::error::Makefile does not define PKG_VERSION"
            exit 1
          fi
          if [[ "$release_version" != "$makefile_version" ]]; then
            echo "::error::Release version $release_version does not match Makefile PKG_VERSION $makefile_version; bump Makefile first"
            exit 1
          fi

      - name: Run release checks and build packages
        run: scripts/release-check.sh "${{ steps.version.outputs.value }}" dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.ipk
            dist/*.apk
            dist/sha256sums.txt
          generate_release_notes: true
